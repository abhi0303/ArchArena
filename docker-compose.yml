# Local PostgreSQL for development. Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archarena
      POSTGRES_PASSWORD: archarena
      POSTGRES_DB: archarena
    ports:
      - '5432:5432'
    volumes:
      - archarena-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archarena']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  archarena-pg:
